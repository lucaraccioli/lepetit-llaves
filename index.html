
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263746">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LePetit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Reservas · LePetit</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px 12px 35px;
  background:#f3f5f7;color:#20252b;
  font-family:Arial,sans-serif
}
.wrap{max-width:620px;margin:auto}
header{padding:7px 4px 17px}
h1{font-size:23px;margin:0}
.sub{font-size:13px;color:#68717c;margin-top:6px}
.bar{
  display:flex;justify-content:space-between;
  align-items:center;margin:0 2px 14px;gap:8px
}
#count{font-size:13px;color:#59636e}
button{
  border:0;border-radius:9px;background:#263746;
  color:white;padding:10px 14px;font-weight:bold;
  cursor:pointer
}
.install-btn{
  width:100%;background:#263746;color:white;
  border:0;border-radius:10px;padding:14px;
  margin:0 0 14px;font-size:14px;font-weight:bold
}
.install-info{
  display:none;background:white;border:1px solid #dce2e8;
  border-radius:12px;padding:16px;margin-bottom:14px;
  line-height:1.6;font-size:14px
}
.install-info strong{display:block;margin-bottom:7px}
.install-info button{
  margin-top:12px;background:#e9edf0;color:#263746
}
.card{
  background:white;border:1px solid #e5e9ed;
  border-radius:15px;padding:15px;margin-bottom:13px;
  box-shadow:0 2px 8px #1423320b
}
.guest{font-size:18px;font-weight:750;overflow-wrap:anywhere}
.dept{font-size:12px;color:#69737e;margin-top:4px}
.dates,.details{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:13px
}
.date{
  background:#f2f5f8;border-radius:11px;
  text-align:center;padding:10px 7px
}
.label{
  font-size:10px;font-weight:800;
  letter-spacing:.6px;color:#687481
}
.day{font-size:34px;font-weight:800;color:#263746;margin:4px 0 2px}
.month{font-size:13px;font-weight:bold;text-transform:capitalize}
.year{font-size:11px;color:#687481;margin-top:2px}
.wa{
  display:flex;justify-content:center;align-items:center;
  text-align:center;text-decoration:none;background:#20b85a;
  color:white;border-radius:10px;min-height:45px;
  padding:10px;margin-top:12px;font-size:13px;
  font-weight:800;overflow-wrap:anywhere
}
.off{background:#d9dee3;color:#65717c}
.detail{
  background:#fafbfc;border:1px solid #e9edf0;
  border-radius:10px;padding:10px;min-width:0
}
.detail .label{line-height:1.35}
.value{
  font-size:14px;font-weight:650;line-height:1.4;
  margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere
}
.empty,.loading{
  text-align:center;padding:26px 15px;color:#68717c;
  background:white;border-radius:13px
}
.error{color:#a52a2a}
@media(max-width:360px){
  .card{padding:12px}
  .day{font-size:30px}
  .detail{padding:8px}
  .detail .label{font-size:9px}
}
</style>
</head>

<body>
<main class="wrap">

<header>
  <h1>Reservas · LePetit</h1>
  <div class="sub">Próximos ingresos y datos de los huéspedes</div>
</header>

<button class="install-btn" id="installBtn">
  ＋ AGREGAR LEPETIT A MI CELULAR
</button>

<div id="installInfo" class="install-info"></div>

<div class="bar">
  <span id="count">Cargando…</span>
  <button onclick="cargar()">↻ Actualizar</button>
</div>

<section id="reservas">
  <div class="loading">Cargando reservas…</div>
</section>

</main>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbz78c7GzLlRSyNE-RIwFVewWxBFyW5f5K7XxeE1GOz85rAWUJnoJrb5KW5s-r_XFY7h/exec';

function esc(x){
  return String(x==null?'':x).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function tarjeta(r){
  const wa=r.whatsapp
    ? '<a class="wa" href="https://wa.me/'+
      encodeURIComponent(r.whatsapp)+
      '" target="_blank" rel="noopener">◉ '+
      esc(r.telefono)+' · ABRIR WHATSAPP</a>'
    : '<div class="wa off">'+
      esc(r.telefono||'Teléfono no informado')+'</div>';

  return '<article class="card">'+
    '<div class="guest">'+esc(r.huesped)+'</div>'+
    (r.departamento
      ? '<div class="dept">Departamento '+esc(r.departamento)+'</div>'
      : '')+
    '<div class="dates">'+
      '<div class="date">'+
        '<div class="label">INGRESO</div>'+
        '<div class="day">'+esc(r.ingresoDia)+'</div>'+
        '<div class="month">'+esc(r.ingresoMes)+'</div>'+
        '<div class="year">'+esc(r.ingresoAnio)+'</div>'+
      '</div>'+
      '<div class="date">'+
        '<div class="label">SALIDA</div>'+
        '<div class="day">'+esc(r.salidaDia)+'</div>'+
        '<div class="month">'+esc(r.salidaMes)+'</div>'+
        '<div class="year">'+esc(r.salidaAnio)+'</div>'+
      '</div>'+
    '</div>'+
    wa+
    '<div class="details">'+
      '<div class="detail">'+
        '<div class="label">SALDO A ABONAR EL DÍA DE INGRESO</div>'+
        '<div class="value">'+esc(r.saldo||'—')+'</div>'+
      '</div>'+
      '<div class="detail">'+
        '<div class="label">OBSERVACIONES</div>'+
        '<div class="value">'+esc(r.observaciones||'Sin observaciones')+'</div>'+
      '</div>'+
    '</div>'+
  '</article>';
}

/* Consulta las reservas mediante JSONP */
function cargar(){
  const contenedor=document.getElementById('reservas');
  const contador=document.getElementById('count');

  contador.textContent='Actualizando…';
  contenedor.innerHTML='<div class="loading">Cargando…</div>';

  const nombre='lepetitCallback_'+Date.now();
  const script=document.createElement('script');
  let terminado=false;

  const limpiar=()=>{
    if(terminado)return;
    terminado=true;
    delete window[nombre];
    script.remove();
  };

  const timeout=setTimeout(()=>{
    limpiar();
    contador.textContent='Error al cargar';
    contenedor.innerHTML=
      '<div class="empty error">La consulta tardó demasiado. Revisá tu conexión e intentá nuevamente.</div>';
  },20000);

  window[nombre]=(datos)=>{
    if(terminado)return;
    clearTimeout(timeout);
    limpiar();

    if(!Array.isArray(datos)){
      contador.textContent='Error al cargar';
      contenedor.innerHTML=
        '<div class="empty error">La respuesta recibida no es válida.</div>';
      return;
    }

    contador.textContent=datos.length+' reservas próximas';
    contenedor.innerHTML=datos.length
      ? datos.map(tarjeta).join('')
      : '<div class="empty">No hay reservas próximas cargadas.</div>';
  };

  script.onerror=()=>{
    if(terminado)return;
    clearTimeout(timeout);
    limpiar();
    contador.textContent='Error al cargar';
    contenedor.innerHTML=
      '<div class="empty error">No se pudo conectar con las reservas. Intentá nuevamente.</div>';
  };

  script.src=API_URL+'?api=reservas&callback='+nombre;
  document.body.appendChild(script);
}

/* Instalación Android y ayuda para iPhone */
let instalacionPendiente=null;

window.addEventListener('beforeinstallprompt',evento=>{
  evento.preventDefault();
  instalacionPendiente=evento;
  document.getElementById('installBtn').textContent=
    '＋ INSTALAR LEPETIT EN MI CELULAR';
});

window.addEventListener('appinstalled',()=>{
  instalacionPendiente=null;
  mostrarMensaje('¡LePetit quedó instalado! Ya podés abrirlo desde tu pantalla de inicio.');
});

function mostrarMensaje(html){
  const caja=document.getElementById('installInfo');
  caja.innerHTML=html+
    '<button onclick="cerrarMensaje()">Cerrar</button>';
  caja.style.display='block';
}

function cerrarMensaje(){
  document.getElementById('installInfo').style.display='none';
}

async function instalarLePetit(){
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/i.test(ua);
  const standalone=window.matchMedia('(display-mode: standalone)').matches
    || navigator.standalone===true;

  if(standalone){
    mostrarMensaje('<strong>¡LePetit ya está instalado!</strong> Podés entrar desde el ícono de tu pantalla de inicio.');
    return;
  }

  if(instalacionPendiente){
    instalacionPendiente.prompt();
    const resultado=await instalacionPendiente.userChoice;
    instalacionPendiente=null;

    if(resultado.outcome==='accepted'){
      mostrarMensaje('<strong>¡Perfecto!</strong> LePetit se está instalando en tu celular.');
    }
    return;
  }

  if(ios){
    mostrarMensaje(
      '<strong>📱 Agregar LePetit en iPhone</strong>'+
      '1. Abrí esta página en Safari.<br>'+
      '2. Tocá Compartir (el cuadrado con la flecha hacia arriba).<br>'+
      '3. Elegí «Agregar a pantalla de inicio».<br>'+
      '4. Confirmá tocando «Agregar».<br><br>'+
      '¡Listo! Encontrarás LePetit junto a tus aplicaciones.'
    );
    return;
  }

  if(/Android/i.test(ua)){
    mostrarMensaje(
      '<strong>📱 Agregar LePetit en Android</strong>'+
      'Si no apareció la ventana automática, abrí el menú de Chrome (⋮) y elegí «Instalar aplicación» o «Agregar a pantalla principal».<br><br>'+
      'Confirmá la instalación y listo.'
    );
    return;
  }

  mostrarMensaje(
    '<strong>Agregar LePetit</strong>'+
    'Abrí esta página desde el navegador de tu celular y buscá la opción «Agregar a pantalla de inicio».'
  );
}

document.getElementById('installBtn')
  .addEventListener('click',instalarLePetit);

/* Registrar el service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(error=>{
      console.log('No se pudo registrar el service worker:',error);
    });
  });
}

cargar();
</script>
</body>
</html>
